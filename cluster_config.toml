name = "cluster_config"

# addresses that the nodes will listen on 
addresses = [
	"localhost:4000",
	"localhost:4001",
	"localhost:4002",
]

# used by dev-tools to hijack a cluster with higher terms
# faster or slower heartbeats
forceTerm = 101
heartbeat = 10

# tells the cluster to only run a single node, instead of all nodes provided 
# in [addresses]. This was introduced to allow isolated running on docker containers
single = false
